spring.application.name=captabot-api
server.port=${PORT:8080}

# Base de datos (ver base-datos/README.md)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/captabot}
spring.datasource.username=${DB_USER:captabot}
spring.datasource.password=${DB_PASSWORD:captabot}

# El esquema lo crean los scripts SQL; Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Clave que deben enviar el panel y las integraciones en la cabecera X-API-Key.
# Si se deja vacía, la API no pide clave (solo para desarrollo local).
captabot.api-key=${CAPTABOT_API_KEY:}

# Asistente: Azure AI Language, custom question answering (plan gratuito F0). Ver asistente/README.md.
# Si se dejan vacías, el chat responde con su buscador local de preguntas frecuentes.
captabot.azure.language.endpoint=${AZURE_LANGUAGE_ENDPOINT:}
captabot.azure.language.clave=${AZURE_LANGUAGE_KEY:}
captabot.azure.language.proyecto=${AZURE_LANGUAGE_PROYECTO:}

# Otros sitios que pueden insertar el chat, separados por comas. Vacío: solo la página que sirve esta API.
captabot.chat.origenes=${CAPTABOT_CHAT_ORIGENES:}

# Canal de Telegram: token que entrega @BotFather. Vacío: el bot no se inicia. Ver asistente/README.md.
captabot.telegram.token=${TELEGRAM_BOT_TOKEN:}
