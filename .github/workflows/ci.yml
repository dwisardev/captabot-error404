# Integración continua de CaptaBot – Equipo ERROR 404
# Se ejecuta en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  base-datos:
    name: Base de datos (scripts SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: captabot
          POSTGRES_PASSWORD: captabot
          POSTGRES_DB: captabot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U captabot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: captabot
      PGPASSWORD: captabot
      PGDATABASE: captabot
    steps:
      - uses: actions/checkout@v5

      - name: Ejecutar los scripts
        run: |
          psql -v ON_ERROR_STOP=1 -f base-datos/scripts/01_crear_esquema.sql
          psql -v ON_ERROR_STOP=1 -f base-datos/scripts/02_vistas_reportes.sql
          psql -v ON_ERROR_STOP=1 -f base-datos/datos-prueba/01_datos_prueba.sql

      - name: Verificar los datos de prueba
        run: |
          test "$(psql -tAc 'SELECT COUNT(*) FROM prospectos')" = "10"
          psql -c 'SELECT * FROM v_embudo_etapas'
          psql -c 'SELECT * FROM v_tasa_conversion'

  api:
    name: API (compilación y pruebas unitarias)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Compilar y ejecutar las pruebas
        run: mvn -B -ntp verify

  panel:
    name: Panel .NET (compilación y pruebas xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Compilar y ejecutar las pruebas
        run: dotnet test panel/CaptaBot.Panel.Tests/CaptaBot.Panel.Tests.csproj -c Release

  integracion:
    name: Prueba de integración (BD + API + panel)
    needs: [base-datos, api, panel]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: captabot
          POSTGRES_PASSWORD: captabot
          POSTGRES_DB: captabot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U captabot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: captabot
      PGPASSWORD: captabot
      PGDATABASE: captabot
      DB_URL: jdbc:postgresql://localhost:5432/captabot
      DB_USER: captabot
      DB_PASSWORD: captabot
      CAPTABOT_API_KEY: clave-de-prueba-ci
      API: http://localhost:8080
      PANEL: http://localhost:5080
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Crear la base de datos
        run: |
          psql -v ON_ERROR_STOP=1 -f base-datos/scripts/01_crear_esquema.sql
          psql -v ON_ERROR_STOP=1 -f base-datos/scripts/02_vistas_reportes.sql
          psql -v ON_ERROR_STOP=1 -f base-datos/datos-prueba/01_datos_prueba.sql

      - name: Compilar la API
        working-directory: api
        run: mvn -B -ntp -DskipTests package

      - name: Iniciar la API
        run: |
          nohup java -jar api/target/captabot-api.jar > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs "$API/api/health" && exit 0
            sleep 2
          done
          echo "La API no respondió a tiempo"
          exit 1

      - name: Probar el flujo asistente → API → base de datos
        run: |
          set -e
          echo "1. Sin clave, la API responde 401"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/api/prospectos" \
            -H 'Content-Type: application/json' -d '{}')
          test "$code" = "401"

          echo "2. Registro válido: se califica como CALIENTE"
          resp=$(curl -fs -X POST "$API/api/prospectos" \
            -H 'Content-Type: application/json' -H "X-API-Key: $CAPTABOT_API_KEY" \
            -d '{"nombre":"Prueba CI","telefono":"987654321","servicioInteres":"Diseño web","presupuesto":6000,"urgencia":"alta"}')
          echo "$resp"
          echo "$resp" | grep -q '"calificacion":"CALIENTE"'

          echo "3. El prospecto quedó guardado en PostgreSQL"
          test "$(psql -tAc "SELECT calificacion || '/' || etapa FROM prospectos WHERE nombre = 'Prueba CI'")" = "CALIENTE/NUEVO"

          echo "4. Datos inválidos: la API responde 400"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/api/prospectos" \
            -H 'Content-Type: application/json' -H "X-API-Key: $CAPTABOT_API_KEY" \
            -d '{"nombre":"X","telefono":"123","servicioInteres":"Y","presupuesto":10,"urgencia":"alta"}')
          test "$code" = "400"

          echo "5. La lista filtrada incluye el nuevo prospecto"
          curl -fs -H "X-API-Key: $CAPTABOT_API_KEY" "$API/api/prospectos?calificacion=CALIENTE" | grep -q 'Prueba CI'
          echo "Prueba de integración completada"

      - name: Probar usuarios, seguimiento y reportes en la API
        run: |
          set -e
          H="X-API-Key: $CAPTABOT_API_KEY"
          J='Content-Type: application/json'

          echo "1. Inicio de sesión del administrador de prueba"
          curl -fs -X POST "$API/api/auth/login" -H "$H" -H "$J" \
            -d '{"correo":"admin@captabot.pe","contrasena":"Demo2026!"}' | jq -e '.rol == "ADMINISTRADOR"'

          echo "2. Contraseña incorrecta: 401"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/api/auth/login" -H "$H" -H "$J" \
            -d '{"correo":"admin@captabot.pe","contrasena":"otra-clave"}')
          test "$code" = "401"

          echo "3. No se repiten correos: 409"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/api/usuarios" -H "$H" -H "$J" \
            -d '{"nombre":"Otro","correo":"ADMIN@captabot.pe","contrasena":"Segura2026","rol":"VENDEDOR"}')
          test "$code" = "409"

          echo "4. Crear un vendedor y desactivarlo"
          vendedor=$(curl -fs -X POST "$API/api/usuarios" -H "$H" -H "$J" \
            -d '{"nombre":"Vendedor CI","correo":"vendedor.ci@captabot.pe","contrasena":"Segura2026","rol":"VENDEDOR"}' | jq -r '.id')
          curl -fs -X PATCH "$API/api/usuarios/$vendedor/estado" -H "$H" -H "$J" -d '{"activo":false}' | jq -e '.activo == false'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/api/auth/login" -H "$H" -H "$J" \
            -d '{"correo":"vendedor.ci@captabot.pe","contrasena":"Segura2026"}')
          test "$code" = "401"

          echo "5. Lista paginada: calientes primero"
          curl -fs "$API/api/prospectos?tamano=5" -H "$H" | jq -e '.tamano == 5 and .totalElementos >= 11 and .contenido[0].calificacion == "CALIENTE"'

          echo "6. Cambio de etapa con historial"
          id=$(psql -tAc "SELECT id FROM prospectos WHERE nombre = 'Prueba CI'")
          curl -fs -X PATCH "$API/api/prospectos/$id/etapa" -H "$H" -H "$J" -d '{"etapa":"contactado","usuarioId":1}' | jq -e '.etapa == "CONTACTADO"'
          curl -fs "$API/api/prospectos/$id/historial" -H "$H" | jq -e '.[0].etapaNueva == "CONTACTADO" and .[0].usuario != null'

          echo "7. Notas: solo el autor puede editar"
          nota=$(curl -fs -X POST "$API/api/prospectos/$id/notas" -H "$H" -H "$J" \
            -d '{"usuarioId":1,"contenido":"Llamar el lunes"}' | jq -r '.id')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$API/api/prospectos/$id/notas/$nota" -H "$H" -H "$J" \
            -d '{"usuarioId":2,"contenido":"Cambio ajeno"}')
          test "$code" = "403"

          echo "8. Reportes"
          curl -fs "$API/api/reportes/semanal" -H "$H" | jq -e 'length == 8'
          curl -fs "$API/api/reportes/embudo" -H "$H" | jq -e 'length == 5'
          curl -fs "$API/api/reportes/conversion?desde=2020-01-01&hasta=2099-12-31" -H "$H" | jq -e '.totalProspectos >= 11 and .ganados >= 1'
          echo "Usuarios, seguimiento y reportes verificados"

      - name: Probar el chat del asistente
        run: |
          set -e
          J='Content-Type: application/json'
          enviar() {
            curl -fs -X POST "$API/api/chat/mensajes" -H "$J" \
              -d "$(jq -n --arg s "$1" --arg t "$2" '{sesionId: (if $s == "" then null else $s end), texto: $t}')"
          }
          echo "1. La página web con el chat se sirve desde la API"
          curl -fs "$API/" | grep -q 'captabot-chat.js'
          curl -fs "$API/api/health" | jq -e '.preguntasFrecuentes == "local"'

          echo "2. El chat es público: responde sin la clave de la API"
          s=$(enviar "" "" | jq -r '.sesionId')
          enviar "$s" "¿Cuál es su horario?" | jq -e '.mensajes[0] | contains("lunes a viernes")'
          enviar "$s" "No" | jq -e 'any(.opciones[]; . == "Quiero cotizar")'

          echo "3. Conversación completa: el prospecto queda registrado y calificado"
          for t in "Quiero cotizar" "Sí, acepto" "Chat CI" "12345"; do r=$(enviar "$s" "$t"); done
          echo "$r" | jq -e '.mensajes[0] | contains("9 dígitos")'
          for t in "987 111 222" "Marketing digital" "S/ 2,500" "Media: este mes"; do r=$(enviar "$s" "$t"); done
          echo "$r" | jq -e '.registrado == true'
          test "$(psql -tAc "SELECT telefono || '/' || calificacion || '/' || puntaje FROM prospectos WHERE nombre = 'Chat CI'")" = "987111222/TIBIO/65"
          echo "Chat del asistente verificado"

      - name: Ejecutar la colección de Postman
        run: |
          npx --yes newman@6 run pruebas/postman/CaptaBot.postman_collection.json \
            -e pruebas/postman/CaptaBot-local.postman_environment.json \
            --env-var "baseUrl=$API" --env-var "apiKey=$CAPTABOT_API_KEY"

      - name: Iniciar el panel
        run: |
          dotnet build panel/CaptaBot.Panel/CaptaBot.Panel.csproj -c Release
          cd panel/CaptaBot.Panel
          CaptabotApi__UrlBase="$API" CaptabotApi__ClaveApi="$CAPTABOT_API_KEY" \
            nohup dotnet bin/Release/net10.0/CaptaBot.Panel.dll --urls "$PANEL" > ../../panel.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs -o /dev/null "$PANEL/Cuenta/Login" && exit 0
            sleep 2
          done
          echo "El panel no respondió a tiempo"
          exit 1

      - name: Probar el panel de punta a punta
        run: |
          set -e
          echo "1. Sin sesión, el panel redirige al inicio de sesión"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PANEL/Prospectos")
          test "$code" = "302"

          echo "2. Iniciar sesión con el administrador de prueba"
          token=$(curl -fs -c sesion.txt -b sesion.txt "$PANEL/Cuenta/Login" \
            | python3 -c 'import re,sys; print(re.search(r"__RequestVerificationToken\"[^>]*value=\"([^\"]+)\"", sys.stdin.read()).group(1))')
          destino=$(curl -s -c sesion.txt -b sesion.txt -o /dev/null -w '%{http_code} %{redirect_url}' \
            -X POST "$PANEL/Cuenta/Login" \
            --data-urlencode 'Correo=admin@captabot.pe' --data-urlencode 'Contrasena=Demo2026!' \
            --data-urlencode "__RequestVerificationToken=$token")
          echo "$destino"
          echo "$destino" | grep -qE "^302 $PANEL/(Prospectos)?$"

          echo "3. La lista muestra los prospectos"
          curl -fs -b sesion.txt "$PANEL/Prospectos" | grep -q 'Prueba CI'

          echo "4. Reportes y descarga de Excel"
          curl -fs -b sesion.txt "$PANEL/Reportes" | grep -q 'Tasa de conversión'
          curl -fs -b sesion.txt -o reporte.xlsx "$PANEL/Reportes/Excel"
          python3 -c "import zipfile; z = zipfile.ZipFile('reporte.xlsx'); assert 'xl/worksheets/sheet3.xml' in z.namelist()"

          echo "5. El administrador ve la gestión de usuarios"
          curl -fs -b sesion.txt "$PANEL/Usuarios" | grep -q 'vendedor.ci@captabot.pe'
          echo "Panel verificado de punta a punta"

      - name: Mostrar los logs
        if: always()
        run: |
          echo "=== API ==="; cat api.log || true
          echo "=== Panel ==="; cat panel.log || true
