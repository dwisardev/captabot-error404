spring.application.name=captabot-api
server.port=${PORT:8080}

# Base de datos (ver base-datos/README.md)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/captabot}
spring.datasource.username=${DB_USER:captabot}
spring.datasource.password=${DB_PASSWORD:captabot}

# El esquema lo crean los scripts SQL; Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Clave que debe enviar watsonx Assistant en la cabecera X-API-Key.
# Si se deja vacía, la API no pide clave (solo para desarrollo local).
captabot.api-key=${CAPTABOT_API_KEY:}
